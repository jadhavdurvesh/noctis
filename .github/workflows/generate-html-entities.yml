name: Generate HTML entity table

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_html_entities.py"
      - ".github/workflows/generate-html-entities.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate entity table
        run: python tools/generate_html_entities.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/noctis-html/src/named_entities.tsv
          if git diff --cached --quiet; then
            echo "Entity table is already up to date."
            exit 0
          fi
          git commit -m "Generate complete HTML named character reference table"
          git push
