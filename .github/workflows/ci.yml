name: NOCTIS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build desktop browser and engine CLI
        run: cargo build --release -p noctis-browser -p noctis-cli
      - name: Upload desktop browser binaries
        uses: actions/upload-artifact@v4
        with:
          name: noctis-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/noctis-browser*
            target/release/noctis-cli*
          if-no-files-found: error
          retention-days: 30
