name: NOCTIS Release Builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build NOCTIS CLI
        run: cargo build --release -p noctis-cli
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ runner.arch }}
        run: |
          $stage = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/noctis-cli.exe" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          $asset = "noctis-$env:PLATFORM-$($env:ARCH.ToLower()).zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset
      - name: Package Linux or macOS executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          stage="package"
          mkdir -p "$stage"
          cp target/release/noctis-cli "$stage/"
          cp README.md LICENSE "$stage/"
          arch="$(printf '%s' "$ARCH" | tr '[:upper:]' '[:lower:]')"
          tar -C "$stage" -czf "noctis-$PLATFORM-$arch.tar.gz" .
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: noctis-${{ matrix.platform }}-${{ runner.arch }}
          path: noctis-${{ matrix.platform }}-*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK (arm64, armv7, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build NOCTIS Rust libraries for Android ABIs
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release -p noctis-android-bridge
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic
      - name: Build Android APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apkanalyzer apk summary "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libnoctis_android_bridge.so"
          done
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: noctis-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: NOCTIS ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
